{{ define "main" }}
<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
  </header>
  <div class="post-content">
    {{ .Content }}
  </div>
  {{ partial "timeline.html" . }}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Jordi Mariezcurrena",
    "url": "{{ .Site.BaseURL }}"
  }
  </script>
</article>
{{ end }}
